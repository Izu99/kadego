# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the KadeGo API as a free web service from the server/ folder.
services:
  - type: web
    name: kadego-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI # paste your MongoDB Atlas link when Render asks
        sync: false
      - key: JWT_SECRET
        generateValue: true
